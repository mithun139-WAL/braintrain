<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BrainTrain - Email OTP Request</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b981", // Emerald green as requested, overriding default blue
                        "primary-hover": "#059669",
                        "background-light": "#f6f7f7",
                        "background-dark": "#15191d",
                        "secondary-text": "#64748b",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="w-full px-6 py-4 flex items-center justify-between border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-3xl">psychology</span>
<span class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">BrainTrain</span>
</div>
<a class="text-sm font-medium text-slate-600 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[18px]">help</span>
            Help &amp; Support
        </a>
</header>
<main class="flex-1 flex items-center justify-center p-4 sm:p-8">
<div class="w-full max-w-[400px] bg-white dark:bg-slate-800 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-lg overflow-hidden border border-slate-200 dark:border-slate-700">
<div class="h-1.5 w-full bg-primary"></div>
<div class="p-8">
<div class="mb-8 text-center">
<h1 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Sign in with OTP</h1>
<p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed">
                        Enter your registered email address to receive a secure one-time password.
                    </p>
</div>
<form class="flex flex-col gap-5" onsubmit="event.preventDefault();">
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" for="email">
                            Email address
                        </label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-[20px]">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600 rounded-lg text-slate-900 dark:text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all sm:text-sm" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="flex items-center justify-center w-full py-2.5 px-4 rounded-lg bg-primary hover:bg-primary-hover text-white font-semibold shadow-sm transition-all active:scale-[0.98] gap-2">
<span>Request OTP</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="text-center pt-2">
<a class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors" href="#">
                            Back to Login
                        </a>
</div>
</form>
</div>
</div>
</main>
<footer class="py-6 text-center">
<p class="text-xs text-slate-400 dark:text-slate-600">
            © 2024 BrainTrain Inc. All rights reserved.
        </p>
</footer>

</body></html>

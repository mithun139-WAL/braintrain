<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BrainTrain Login Consistent Theme</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#059669", 
                        "primary-hover": "#047857",
                        "background-light": "#f4f4f5", 
                        "background-dark": "#18181b",
                        "surface-light": "#ffffff",
                        "surface-dark": "#27272a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem", 
                        "lg": "0.5rem", 
                        "xl": "0.75rem", 
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
<header class="w-full px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-2 text-gray-900 dark:text-white">
<div class="h-8 w-8 bg-primary rounded flex items-center justify-center text-white">
<span class="material-symbols-outlined text-xl">psychology</span>
</div>
<span class="font-bold text-lg tracking-tight">BrainTrain</span>
</div>
<div>
<a class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-lg">help</span>
                Help &amp; Support
            </a>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-4">
<div class="w-full max-w-[420px] bg-surface-light dark:bg-surface-dark rounded-xl shadow-xl overflow-hidden relative border border-gray-200 dark:border-gray-700">
<div class="h-2 w-full bg-primary absolute top-0 left-0 right-0"></div>
<div class="p-8 pt-10">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Welcome back</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm">Train smarter. Perform confidently.</p>
</div>
<form action="#" class="space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300" for="email">Email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary sm:text-sm bg-white dark:bg-gray-800 transition-all shadow-sm" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-300" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary sm:text-sm bg-white dark:bg-gray-800 transition-all shadow-sm" id="password" name="password" placeholder="Enter your password" type="password"/>
</div>
<div class="flex justify-end pt-1">
<a class="text-xs font-semibold text-primary hover:text-primary-hover transition-colors flex items-center gap-1 group" href="#">
                                Login using OTP
                                <span class="material-symbols-outlined text-[14px] group-hover:translate-x-0.5 transition-transform">arrow_forward</span>
</a>
</div>
</div>
<button class="w-full group flex items-center justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 gap-2" type="submit">
                        Sign In
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-light dark:bg-surface-dark text-gray-500 text-xs font-semibold uppercase tracking-wider">Or continue with</span>
</div>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 transition-colors" type="button">
<svg aria-hidden="true" class="h-5 w-5 mr-2" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                            Google
                        </button>
<button class="flex items-center justify-center px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px] mr-2 text-gray-500">smartphone</span>
                            Mobile
                        </button>
</div>
<div class="mt-8 flex flex-col items-center justify-center gap-3 pt-4 border-t border-gray-100 dark:border-gray-700/50">
<div class="text-gray-600 dark:text-gray-400 text-sm">
                            New to BrainTrain? <a class="font-semibold text-primary hover:text-primary-hover transition-colors" href="#">Create an account</a>
</div>
<a class="text-gray-500 hover:text-gray-700 dark:hover:text-gray-300 text-xs font-medium transition-colors" href="#">Forgot password?</a>
</div>
</form>
</div>
</div>
</main>
<footer class="w-full py-6 text-center">
<p class="text-xs text-gray-400 dark:text-gray-600 font-medium">© 2024 BrainTrain Inc. All rights reserved.</p>
</footer>

</body></html>

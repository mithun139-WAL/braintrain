<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BrainTrain - Mobile Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#10b981", // Emerald 500
                        "primary-dark": "#059669", // Emerald 600
                        "primary-light": "#d1fae5", // Emerald 100
                        "background-light": "#f8fafc", // Slate 50
                        "background-dark": "#0f172a", // Slate 900
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px" },
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen flex flex-col antialiased">
<header class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-6 py-4 bg-white dark:bg-slate-900">
<div class="flex items-center gap-3">
<div class="flex items-center justify-center w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 dark:bg-emerald-900 dark:text-emerald-400">
<span class="material-symbols-outlined text-[20px]">psychology</span>
</div>
<h2 class="text-slate-900 dark:text-white text-lg font-bold tracking-tight">BrainTrain</h2>
</div>
<a class="text-sm font-medium text-slate-500 hover:text-primary dark:text-slate-400 dark:hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-[18px]">help</span>
<span class="hidden sm:inline">Help &amp; Support</span>
</a>
</header>
<main class="flex-grow flex items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-800 overflow-hidden relative">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-400 to-emerald-600"></div>
<div class="p-8 sm:p-10">
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-emerald-50 dark:bg-emerald-900/30 mb-6 text-emerald-600 dark:text-emerald-400">
<span class="material-symbols-outlined text-[32px]">smartphone</span>
</div>
<h1 class="text-2xl sm:text-3xl font-bold text-slate-900 dark:text-white mb-3 tracking-tight">Mobile Login</h1>
<p class="text-slate-500 dark:text-slate-400 text-base leading-relaxed">
                        Enter your mobile number to receive a secure code.
                    </p>
</div>
<form class="space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="block text-sm font-semibold text-slate-700 dark:text-slate-300" for="mobile-number">
                            Mobile Number
                        </label>
<div class="flex gap-3">
<div class="relative w-1/3">
<select class="appearance-none w-full pl-3 pr-8 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all font-medium">
<option value="+1">US +1</option>
<option value="+44">UK +44</option>
<option value="+61">AU +61</option>
<option value="+91">IN +91</option>
<option value="+81">JP +81</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-[20px]">expand_more</span>
</div>
</div>
<div class="relative flex-1">
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white placeholder-slate-400 focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 outline-none transition-all" id="mobile-number" placeholder="555-0123" type="tel"/>
<div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
<span class="material-symbols-outlined text-[20px]">call</span>
</div>
</div>
</div>
</div>
<div class="flex items-center gap-2">
<input class="w-4 h-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500 focus:ring-offset-0 bg-white dark:bg-slate-800 dark:border-slate-700" id="remember" type="checkbox"/>
<label class="text-sm text-slate-600 dark:text-slate-400 select-none cursor-pointer" for="remember">Remember this device</label>
</div>
<button class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary-dark text-white font-bold h-12 rounded-lg shadow-md shadow-emerald-500/20 hover:shadow-emerald-500/30 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2 dark:focus:ring-offset-slate-900 mt-2" type="submit">
<span>Request OTP</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center">
<p class="text-sm text-slate-500 dark:text-slate-400">
                       By continuing, you agree to our 
                       <a class="text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 dark:hover:text-emerald-300 font-medium transition-colors" href="#">Terms of Service</a> 
                       and 
                       <a class="text-emerald-600 dark:text-emerald-400 hover:text-emerald-700 dark:hover:text-emerald-300 font-medium transition-colors" href="#">Privacy Policy</a>.
                   </p>
</div>
</div>
<div class="bg-slate-50 dark:bg-slate-800/50 p-4 text-center border-t border-slate-100 dark:border-slate-800">
<a class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
</main>
<footer class="py-6 text-center">
<p class="text-xs text-slate-400 dark:text-slate-600">
            © 2023 BrainTrain Inc. Secure Authentication System.
        </p>
</footer>

</body></html>

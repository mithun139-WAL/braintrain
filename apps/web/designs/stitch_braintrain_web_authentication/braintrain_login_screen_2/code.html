<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BrainTrain Register</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#059669", // Emerald green as requested
                        "primary-hover": "#047857",
                        "background-light": "#f4f4f5", // Zinc-100
                        "background-dark": "#18181b",
                        "surface-light": "#ffffff",
                        "surface-dark": "#27272a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
</head>
<body class="font-display bg-background-light dark:bg-background-dark min-h-screen flex flex-col">
<header class="w-full px-6 py-4 flex justify-between items-center">
<div class="flex items-center gap-2">
<div class="bg-primary/10 p-1.5 rounded-lg text-primary">
<span class="material-symbols-outlined text-2xl">psychology</span>
</div>
<span class="font-bold text-gray-900 dark:text-white text-lg tracking-tight">BrainTrain</span>
</div>
<a class="text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-primary transition-colors flex items-center gap-1" href="#">
<span class="material-symbols-outlined text-lg">help</span>
            Help &amp; Support
        </a>
</header>
<main class="flex-grow flex items-center justify-center p-4">
<div class="w-full max-w-md bg-surface-light dark:bg-surface-dark rounded-xl shadow-lg border-t-4 border-primary dark:border-primary overflow-hidden">
<div class="px-8 pt-8 pb-8">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2 tracking-tight">Create an account</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm">Train smarter. Perform confidently.</p>
</div>
<form action="#" class="space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-200" for="fullname">Full Name</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-gray-50 dark:bg-gray-800 transition-colors" id="fullname" name="fullname" placeholder="John Doe" type="text"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-200" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-gray-50 dark:bg-gray-800 transition-colors" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<label class="block text-sm font-semibold text-gray-700 dark:text-gray-200" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary sm:text-sm bg-gray-50 dark:bg-gray-800 transition-colors" id="password" name="password" placeholder="Create a strong password" type="password"/>
</div>
</div>
<button class="w-full group flex justify-center items-center gap-2 py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-primary hover:bg-primary-hover focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<div class="relative py-2">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-white dark:bg-surface-dark text-gray-500 text-xs uppercase tracking-wider font-semibold">Or register with</span>
</div>
</div>
<button class="w-full flex items-center justify-center px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-200 transition-colors" type="button">
<svg aria-hidden="true" class="h-5 w-5 mr-2" viewBox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Sign up with Google
                    </button>
<div class="flex items-center justify-center text-sm text-center pt-2">
<div class="text-gray-500">
                            Already have an account? <a class="font-semibold text-primary hover:text-primary-hover transition-colors" href="#">Sign In</a>
</div>
</div>
</form>
</div>
</div>
</main>
<footer class="w-full py-6 text-center text-sm text-gray-500 dark:text-gray-400">
<div class="flex flex-col md:flex-row justify-center items-center gap-4 md:gap-8 mb-2">
<span>© 2023 BrainTrain Inc.</span>
<a class="hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</footer>

</body></html>
